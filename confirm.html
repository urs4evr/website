<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirming Email... | LoveKeeper</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #FFF5F7;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      background-color: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      max-width: 400px;
      width: 90%;
    }
    .spinner {
      border: 4px solid rgba(233, 30, 99, 0.1);
      border-left-color: #E91E63;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      color: #1A1A1A;
      font-size: 20px;
      margin: 0 0 10px 0;
    }
    p {
      color: #666666;
      font-size: 14px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Confirming your email...</h1>
    <p>Please wait a moment while we process your request.</p>
  </div>

  <script>
    // Get the token from the URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    
    if (token) {
      // Redirect to the Supabase Edge Function to complete the confirmation
      window.location.href = "https://ralqvafqgicrzighzkpp.supabase.co/functions/v1/confirm-email?token=" + token;
    } else {
      // No token found, redirect to error page
      window.location.href = "/email-error.html";
    }
  </script>
</body>
</html>
